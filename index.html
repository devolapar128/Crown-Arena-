<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crown Arena</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0000 radial-gradient(#4a0000,#0a0000 75%) fixed;color:#fff;font:15px system-ui,sans-serif;padding-bottom:74px}
#v{padding:12px;max-width:520px;margin:auto}.c{text-align:center;opacity:.7}h3{margin:14px 0 6px;color:#ffd000}
.card{background:linear-gradient(160deg,#1a0505,#000);border:1px solid #c00;border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 0 12px #c0000066}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:6px 0}
input,select,textarea{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #700;background:#150000;color:#fff;font-size:15px}
button{padding:11px 14px;border-radius:10px;border:1px solid #c00;background:#2a0000;color:#fff;font-weight:700;margin:4px 0}
.gold{width:100%;background:linear-gradient(#ffe14d,#f5a300);color:#200;border:0;font-size:16px}.ghost{width:100%;background:none}
.th{width:100%;border-radius:10px;max-height:150px;object-fit:cover}.top{display:flex;align-items:center;gap:10px}.lg{width:46px;border-radius:12px}
.coin{margin-left:auto;background:#ffd000;color:#200;padding:6px 12px;border-radius:20px;font-weight:800}
.sl{display:flex;overflow-x:auto;gap:8px;scroll-snap-type:x mandatory;margin:10px 0}.sl img,.ph{flex:0 0 100%;scroll-snap-align:start;border-radius:12px;height:130px;object-fit:cover}
.ph{background:linear-gradient(90deg,#b00,#ffb000);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.md{height:64px;font-size:15px;background:linear-gradient(160deg,#700,#200);color:#ffd000}
.room{background:#0a3a0a;border:1px solid #0f0;border-radius:10px;padding:8px;margin-top:8px}.big{font-size:34px;font-weight:900;color:#ffd000;text-align:center}
.mt{display:flex;gap:6px;overflow-x:auto;margin-bottom:6px}.mt b{padding:8px 12px;border:1px solid #c00;border-radius:20px;white-space:nowrap}.mt b.on{background:#c00}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#100;border-top:2px solid #c00}nav b{flex:1;text-align:center;padding:8px 0;font-size:11px;opacity:.6}nav b.on{opacity:1;color:#ffd000}
.au{max-width:380px;margin:auto;padding:24px;text-align:center}.lgb{width:120px;border-radius:26px}.au h1{color:#ffd000;text-shadow:0 0 14px #f00}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9}.box{background:#1a0000;border:2px solid #ffd000;border-radius:16px;padding:20px;width:80%;max-width:320px;text-align:center}big{font-size:30px;color:#ffd000}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#ffd000;color:#200;padding:10px 16px;border-radius:20px;z-index:99;font-weight:700}pre{white-space:pre-wrap;font:inherit}

body{background:#050000;position:relative}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 10%,#7a0000aa,transparent 45%),radial-gradient(circle at 85% 80%,#c77a00aa,transparent 40%),radial-gradient(circle at 50% 50%,#2a0000,#050000);animation:bg 8s ease-in-out infinite alternate}
@keyframes bg{to{filter:hue-rotate(-12deg) brightness(1.25)}}@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes shine{to{background-position:200% 0}}@keyframes pul{50%{box-shadow:0 0 22px #ffd000}}
#v>*{animation:up .45s both}
h3{background:linear-gradient(90deg,#ffe14d,#ff7a00);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:18px;letter-spacing:.5px}
.card{background:linear-gradient(145deg,#2a0808cc,#0a0000ee);border:1px solid #ff3b3b66;border-radius:18px;box-shadow:0 6px 22px #000a,inset 0 0 18px #ff000018;backdrop-filter:blur(4px)}
.card.m-br{border-left:5px solid #ff5a1f}.card.m-cs{border-left:5px solid #22c55e}.card.m-lw{border-left:5px solid #8b5cf6}.card.m-cr{border-left:5px solid #f5a300}
.row span{background:#ffffff14;padding:5px 11px;border-radius:20px;font-size:13px;border:1px solid #ffffff1f}
.gold{background:linear-gradient(110deg,#ffb300,#fff0a0,#ffb300,#ff8a00);background-size:250% 100%;animation:shine 3s linear infinite;box-shadow:0 0 16px #ffb30088;border-radius:14px;text-shadow:0 1px 0 #fff6}
button{transition:transform .12s}button:active{transform:scale(.95)}
.md{height:92px;border-radius:18px;font-size:14px;line-height:1.5;border:1px solid #ffd00055;background:linear-gradient(160deg,#8a0000,#1a0000);box-shadow:0 0 14px #c0000066}
.coin{animation:pul 2s infinite;box-shadow:0 0 12px #ffd00088}.lg{border:2px solid #ffd000;box-shadow:0 0 14px #ff3b3b}
.sl img,.ph{border:1px solid #ffd00066;box-shadow:0 0 18px #ff00004d}
nav{background:linear-gradient(#1a0000ee,#000);border-top:2px solid #ff3b3b;box-shadow:0 -4px 20px #ff000055}nav b{font-size:12px;padding:9px 0}nav b.on{text-shadow:0 0 10px #ffd000;transform:translateY(-3px)}
.au h1{font-size:42px;letter-spacing:3px;animation:pul 2.5s infinite;background:linear-gradient(#fff,#ffd000,#ff6a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px #f00)}.lgb{box-shadow:0 0 30px #ff2a2a;border:3px solid #ffd000}
input,select,textarea{border:1px solid #ff3b3b66;background:#0d0000cc}input:focus{outline:2px solid #ffd000}
.mt b{background:#1a0000;box-shadow:0 0 8px #ff000044}.mt b.on{background:linear-gradient(#ff3b3b,#9a0000);box-shadow:0 0 14px #ff3b3b}
.room{background:linear-gradient(#0c4a0c,#052205);box-shadow:0 0 14px #00ff0044;border-radius:12px}
#sp{position:fixed;inset:0;z-index:999;background:radial-gradient(circle at 50% 35%,#8a0000,#120000 60%,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .5s}
#sp img{width:150px;border-radius:32px;border:3px solid #ffd000;box-shadow:0 0 40px #ff2a2a;animation:pul 1.6s infinite}
#sp h1{margin:22px 0 4px;font-size:40px;letter-spacing:4px;background:linear-gradient(#fff,#ffd000,#ff6a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #f00)}
#sp p{margin:0 0 26px;color:#ffd000;letter-spacing:2px}.bar{width:70%;max-width:300px;height:12px;border:2px solid #ffd000;border-radius:10px;overflow:hidden;background:#200}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff3b3b,#ffd000);animation:ld 3s linear forwards}@keyframes ld{to{width:100%}}#pc{margin-top:12px;color:#fff;opacity:.8}

window.fp=()=>{const e=$('#ae').value.trim();if(!e)return toast('Pehle email likho');A.sendPasswordResetEmail(e).then(()=>toast('Reset link email par bheja (spam bhi dekho)')).catch(x=>toast(x.message))};
window.cp=()=>A.sendPasswordResetEmail(ME.email).then(()=>toast('Password badalne ka link email par bheja (spam bhi dekho)')).catch(x=>toast(x.message));
window.lg=()=>A.signInWithEmailAndPassword($('#ae').value.trim(),$('#pw').value).catch(e=>toast(e.message));
window.gg=()=>A.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>toast(e.message));
window.rgs=async()=>{const r=$('#rg');if(r.style.display=='none'){r.style.display='block';return toast('Name & UID bharo, phir Create dabao')}REG=true;try{const c=await A.createUserWithEmailAndPassword($('#ae').value.trim(),$('#pw').value);await mkU(c.user,$('#an').value,$('#af').value);REG=false;boot(c.user)}catch(e){REG=false;toast(e.message)}};
A.onAuthStateChanged(async u=>{if(REG)return;if(!u)return authUI();await mkU(u);boot(u)});
function boot(u){ME=u;$('#app').innerHTML='<div id=v></div><nav>'+[['home','🏠','Home'],['play','🎮','Play'],['wallet','💰','Wallet'],['board','🏆','Board'],['chat','💬','Chat'],['me','👤','Profile']].map(([k,i,n])=>`<b data-t=${k} onclick="go('${k}')">${i}<br>${n}</b>`).join('')+'</nav>';go('home')}
async function go(t){if(CU){CU();CU=null}tab=t||tab;const v=$('#v');v.innerHTML='<p class=c>Loading…</p>';try{U=(await D.doc('users/'+ME.uid).get()).data();CF=(await D.doc('cfg/main').get()).data()||{};v.innerHTML=await V[tab]();if(tab=='chat')lc()}catch(e){v.innerHTML='<p class=c>'+esc(e.message)+'</p>'}document.querySelectorAll('nav b').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))}

window.jn=(id,fee)=>ask(`Entry Fee<br><big>Rs ${fee}</big>`,async()=>{try{await D.runTransaction(async x=>{const tr=D.doc('tournaments/'+id),ur=D.doc('users/'+ME.uid),[t,u]=await Promise.all([x.get(tr),x.get(ur)]),T=t.data(),B=u.data(),P=T.players||[];if(P.some(p=>p.u==ME.uid))throw'Already joined';if(P.length>=T.slots)throw'Full';if(B.bal<T.fee)throw'Balance kam hai - pehle deposit karo';x.update(ur,{bal:B.bal-T.fee});x.update(tr,{players:F.arrayUnion({u:ME.uid,n:B.name,f:B.ff||''})})});toast('Joined! Room ID dekho');go()}catch(e){toast(e.message||e)}},`Pay Rs ${fee}`);
window.rq=async()=>{const type=$('#wt').value,amt=+$('#wam').value,m=$('#wm').value,n=$('#wn').value;if(!(amt>=100&&amt<=50000))return toast('Amount 100 se 50,000');if(type=='withdraw'&&amt>U.bal)return toast('Balance kam hai');const b=D.batch();b.set(D.collection('reqs').doc(),{uid:ME.uid,email:ME.email,name:U.name,type,amt,m,n,st:'pending',ts:Date.now()});if(type=='withdraw')b.update(D.doc('users/'+ME.uid),{bal:F.increment(-amt)});await b.commit();open(`https://wa.me/${CF.wa||WA}?text=`+encodeURIComponent(`${type.toUpperCase()} Rs ${amt}\nMethod: ${m}\nAccount: ${n}\nName: ${U.name}\nEmail: ${ME.email}`));go()};
window.rd=async()=>{const c=$('#cd').value.trim().toUpperCase();if(!c)return;try{await D.runTransaction(async x=>{const cr=D.doc('codes/'+c),s=await x.get(cr);if(!s.exists||s.data().used)throw'Code galat ya use ho chuka';x.update(cr,{used:true,by:ME.email});x.update(D.doc('users/'+ME.uid),{bal:F.increment(s.data().amt)})});toast('Balance add ho gaya');go()}catch(e){toast(e.message||e)}};

play:async()=>{const ts=(await T(mode)).filter(t=>!t.done);return mt()+(ts.map(card).join('')||'<p class=c>Koi tournament nahi</p>')},
wallet:async()=>{const r=(await D.collection('reqs').where('uid','==',ME.uid).get()).docs.map(d=>d.data()).sort((a,b)=>b.ts-a.ts).slice(0,15);return `<div class=card><div class=big>Rs ${U.bal}</div><select id=wt><option value=deposit>Deposit</option><option value=withdraw>Withdraw</option></select><input id=wam type=number placeholder="Amount (100 - 50,000)"><select id=wm><option>JazzCash</option><option>Easypaisa</option><option>Bank Account</option><option>Cash</option></select><input id=wn placeholder="Account number / name"><button class=gold onclick=rq()>Send on WhatsApp</button></div><div class=card><input id=cd placeholder="Referral code"><button class=gold onclick=rd()>Redeem</button></div><h3>History</h3>${r.map(x=>`<div class="card row"><span>${x.type}</span><span>Rs ${x.amt}</span><span>${x.st}</span></div>`).join('')}`},
board:async()=>{const s=await D.collection('lb').orderBy('pts.'+mode,'desc').limit(20).get();const h=s.docs.map((d,i)=>{const x=d.data();return `<div class="card row"><b>#${i+1}</b><span>${esc(x.n)}</span><span>${x.pts[mode]} wins</span></div>`}).join('');return mt()+(h||'<p class=c>Abhi koi winner nahi</p>')},
chat:async()=>`<h3>Team Chat - Teammate dhundo</h3><div id=cb class=card style="height:55vh;overflow:auto"></div><div class=row><input id=cm placeholder="Message likho..." style="flex:1"><button class=gold style="width:auto" onclick=sm()>Send</button></div>`,
me:async()=>`<div class=card><h3>${esc(U.name)}${U.verified?' ✔️':''}</h3><p>${esc(ME.email)}<br>FF UID: ${esc(U.ff||'-')}</p></div><div class=card><h3>Free Fire Verify</h3>${U.verified?'<p>✔️ Verified</p>':`<input id=vf placeholder="Free Fire UID" value="${esc(U.ff||'')}"><input id=vi placeholder="In-game name" value="${esc(U.ign||'')}"><button class=gold onclick=vr()>${U.vreq?'Request bheji hui hai (dobara bhejo)':'Verify karo'}</button>`}</div><div class=card><h3>Rules</h3><pre>${esc(CF.rules||'Rules jaldi aayenge')}</pre></div><button class=gold onclick="open('https://wa.me/${esc(CF.wa||WA)}')">Support</button><button class=gold onclick="open('${esc(CF.team||'https://wa.me/'+WA)}')">Teammate Dhundo (WhatsApp)</button>${staff()?'<button class=ghost onclick="go(\'adm\')">Admin Panel</button>':''}<button class=ghost onclick=cp()>Password badlo</button><button class=ghost onclick="A.signOut()">Logout</button>`,
adm:async()=>{if(!staff())return'';const o=ME.email==OWNER,tb={t:'Tournaments',w:'Requests',c:'Codes',b:'Banners',...(o?{u:'Users',s:'Settings'}:{})};if(!tb[at])at='t';return `<div class=mt>${Object.entries(tb).map(([k,v])=>`<b class="${k==at?'on':''}" onclick="at='${k}';go('adm')">${v}</b>`).join('')}</div>`+await AV[at]()}};

const AV={
t:async()=>{const ts=await T();return `<div class=card><select id=tm>${Object.entries(MODES).map(([k,v])=>`<option value=${k}>${v}</option>`).join('')}</select><input id=tt placeholder=Title><input id=tf type=number placeholder="Entry fee (max ${MAXFEE})"><input id=tp type=number placeholder="Prize pool"><input id=ts type=number placeholder=Slots><input id=tx placeholder="Time e.g. Today 8:00 PM"><input id=tr placeholder="Room ID"><input id=tw placeholder="Room password"><button class=ghost onclick="pk(i=>{IMG=i;toast('Thumbnail select ho gaya')})">Select thumbnail from gallery</button><button class=gold onclick=mk()>Create Tournament</button></div>`+ts.map(t=>`<div class=card><b>${esc(t.title)}</b> ${t.done?'(ended)':''}<br><small>${MODES[t.mode]} • ${(t.players||[]).length}/${t.slots}</small><div class=row><button onclick="er('${t.id}')">Room/Pass</button><button onclick="en('${t.id}')">End</button><button onclick="dl('${t.id}')">Delete</button></div>${(t.players||[]).map(p=>`<div class=row><span>${esc(p.n)} (${esc(p.f)})</span>${t.done?'':`<button onclick="wn('${t.id}','${p.u}')">Winner</button>`}</div>`).join('')}</div>`).join('')},
w:async()=>{const s=await D.collection('reqs').where('st','==','pending').get();return s.docs.map(d=>{const x=d.data();return `<div class=card><b>${x.type} Rs ${x.amt}</b><br>${esc(x.name)} • ${esc(x.email)}<br>${esc(x.m)} ${esc(x.n)}<div class=row><button class=gold style="width:48%" onclick="ap('${d.id}',1)">Approve</button><button style="width:48%" onclick="ap('${d.id}',0)">Reject</button></div></div>`}).join('')||'<p class=c>Koi pending nahi</p>'},
c:async()=>{const s=await D.collection('codes').where('used','==',false).get();return `<div class=card><input id=cn type=number value=10 placeholder="Kitne codes"><input id=ca type=number value=10 placeholder="Har code ke Rs"><button class=gold onclick=gc()>Generate Codes</button></div>`+s.docs.map(d=>`<div class="card row"><b>${d.id}</b><span>Rs ${d.data().amt}</span></div>`).join('')},
b:async()=>{const s=await D.collection('banners').get();return `<button class=gold onclick="pk(async i=>{await D.collection('banners').add({img:i});go('adm')})">+ Banner gallery se</button>`+s.docs.map(d=>`<div class=card><img class=th src="${d.data().img}"><button onclick="D.collection('banners').doc('${d.id}').delete().then(()=>go('adm'))">Delete</button></div>`).join('')},
u:async()=>{const p=(await D.collection('users').where('vreq','==',true).where('verified','==',false).get()).docs;return `<h3>Verify requests</h3>${p.map(d=>{const x=d.data();return `<div class=card><b>${esc(x.name)}</b><br>UID: ${esc(x.ff)}<br>In-game: ${esc(x.ign)}<div class=row><button class=gold style="width:48%" onclick="vo('${d.id}',true)">Verify</button><button style="width:48%" onclick="vo('${d.id}',false)">Reject</button></div></div>`}).join('')||'<p class=c>Koi request nahi</p>'}<div class=card><input id=ue placeholder="Player email"><button class=gold onclick=fu()>Find</button></div><div id=ur></div>`},
s:async()=>`<div class=card><textarea id=sr rows=6 placeholder=Rules>${esc(CF.rules||'')}</textarea><input id=sw placeholder="Support WhatsApp (92370...)" value="${esc(CF.wa||WA)}"><input id=sg placeholder="Teammate WhatsApp group link" value="${esc(CF.team||'')}"><button class=gold onclick="D.doc('cfg/main').set({rules:$('#sr').value,wa:$('#sw').value,team:$('#sg').value}).then(()=>toast('Saved'))">Save</button></div>`};

window.mk=async()=>{const g=i=>$('#'+i).value,fee=+g('tf');if(!g('tt')||!(fee>=0&&fee<=MAXFEE))return toast('Title aur fee (max '+MAXFEE+') bharo');await D.collection('tournaments').add({mode:g('tm'),title:g('tt'),fee,prize:+g('tp'),slots:+g('ts')||50,time:g('tx'),room:g('tr'),pass:g('tw'),img:IMG,players:[],done:false,ts:Date.now()});IMG='';toast('Created');go('adm')};
window.er=async id=>{const r=prompt('Room ID');if(r===null)return;const p=prompt('Password');await D.doc('tournaments/'+id).update({room:r,pass:p||''});go('adm')};
window.en=async id=>{await D.doc('tournaments/'+id).update({done:true});go('adm')};
window.dl=id=>ask('Delete tournament?',async()=>{await D.doc('tournaments/'+id).delete();go('adm')},'Delete');
window.wn=async(id,u)=>{const t=(await D.doc('tournaments/'+id).get()).data(),a=+prompt('Prize amount',t.prize);if(!a)return;const p=t.players.find(x=>x.u==u),b=D.batch();b.update(D.doc('users/'+u),{bal:F.increment(a)});b.set(D.doc('lb/'+u),{n:p.n,pts:{[t.mode]:F.increment(1)},won:F.increment(a)},{merge:true});await b.commit();toast('Prize bhej diya')};
window.ap=async(id,ok)=>{const r=D.doc('reqs/'+id),x=(await r.get()).data(),b=D.batch();b.update(r,{st:ok?'done':'rejected'});if(ok&&x.type=='deposit')b.update(D.doc('users/'+x.uid),{bal:F.increment(x.amt)});if(!ok&&x.type=='withdraw')b.update(D.doc('users/'+x.uid),{bal:F.increment(x.amt)});await b.commit();go('adm')};
window.gc=async()=>{const n=+$('#cn').value,a=+$('#ca').value,b=D.batch();for(let i=0;i<n;i++){const k=Array.from(crypto.getRandomValues(new Uint8Array(5)),x=>x.toString(36).padStart(2,'0').slice(-2)).join('').toUpperCase();b.set(D.doc('codes/'+k),{amt:a,used:false})}await b.commit();go('adm')};
function lc(){CU=D.collection('chat').orderBy('ts','desc').limit(50).onSnapshot(s=>{const b=$('#cb');if(!b)return;b.innerHTML=s.docs.reverse().map(d=>{const x=d.data();return `<p><b>${esc(x.n)}${x.v?' ✔️':''}:</b> ${esc(x.t)}${staff()?` <a onclick="D.doc('chat/${d.id}').delete()">🗑</a>`:''}</p>`}).join('')||'<p class=c>Pehla message likho</p>';b.scrollTop=b.scrollHeight})}
window.sm=async()=>{const t=$('#cm').value.trim().slice(0,200);if(!t)return;$('#cm').value='';await D.collection('chat').add({u:ME.uid,n:U.name,v:!!U.verified,t,ts:Date.now()})};
window.vr=async()=>{const f=$('#vf').value.trim(),i=$('#vi').value.trim();if(!/^\d{8,12}$/.test(f)||!i)return toast('Sahi UID (8-12 number) aur in-game name likho');await D.doc('users/'+ME.uid).update({ff:f,ign:i,vreq:true});toast('Request bhej di. Owner check karega');go()};
window.vo=async(id,ok)=>{await D.doc('users/'+id).update({verified:ok,vreq:false});go('adm')};
window.fu=async()=>{const s=await D.collection('users').where('email','==',$('#ue').value.trim()).get();$('#ur').innerHTML=s.docs.map(d=>{const x=d.data();return `<div class=card><b>${esc(x.name)}</b> Rs ${x.bal}<div class=row><button onclick="ub('${d.id}')">± Balance</button><button onclick="uf('${d.id}','verified',${!x.verified})">${x.verified?'Remove':'Give'} ✔️</button><button onclick="uf('${d.id}','role','${x.role=='mod'?'':'mod'}')">${x.role=='mod'?'Remove mod':'Make mod'}</button></div></div>`}).join('')||'Not found'};
window.ub=async id=>{const a=+prompt('Amount (minus ke liye -50)');if(a)await D.doc('users/'+id).update({bal:F.increment(a)});toast('Done');fu()};
window.uf=async(id,k,v)=>{await D.doc('users/'+id).update({[k]:v});toast('Done');fu()};
</script></body></html>
